name: Basic HTTP Server Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [ main ]

jobs:
  check-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start HTTP server in background
        run: |
          python3 -m http.server 3000 &

      - name: Wait for server to start
        run: sleep 5

      - name: Check if server is active
        run: |
          curl -I http://localhost:3000 | grep "200 OK"
